[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "junct_game_sdk"
version = "0.1.0"
authors = [
  { name = "Junct", email = "bot@junct.dev" },
]
description = "Junct plugin for GAME SDK — access 20+ crypto MCP servers from any Virtuals agent"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Development Status :: 4 - Beta",
]
dependencies = [
  "game-sdk>=0.1.1",
  "requests>=2.28.0",
]

[project.urls]
"Homepage" = "https://junct.dev"
"Repository" = "https://github.com/game-by-virtuals/game-python/tree/main/plugins/junct"
"Bug Tracker" = "https://github.com/game-by-virtuals/game-python/issues"
